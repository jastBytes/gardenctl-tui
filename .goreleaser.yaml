# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gtui

before:
  hooks:
    - go mod tidy

builds:
  - id: gtui
    main: ./cmd/gtui
    binary: gtui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: gtui
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE
      - docs/gardenctl-notes.md

checksum:
  name_template: checksums.txt

release:
  # Publishing the Release Drafter draft creates the tag and runs this; goreleaser
  # then adds the binaries to that release and keeps its notes. A tag pushed
  # without a release gets one with the changelog below.
  mode: keep-existing

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: gtui
    # The tap repository has to exist before the first release, see README ("Releasing").
    repository:
      owner: jastbytes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/jastbytes/gardenctl-tui
    description: Terminal UI for Gardener landscapes, built on gardenctl
    dependencies:
      - formula: gardener/tap/gardenctl-v2
    # Homebrew deprecated the raw Ruby `postflight` block that `hooks.post.install`
    # renders, so the declarative `postflight_steps` stanza is written here instead.
    # Switch to `hooks.post.install_steps` once a GoReleaser release supports it.
    # `{{staged_path}}` is a Homebrew token; the outer braces stop GoReleaser from
    # expanding it as one of its own templates.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/gtui"]
        end
      end

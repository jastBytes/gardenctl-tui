version: "2"
linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests read files they wrote into their own temp dirs.
      - path: _test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jastbytes/gardenctl-tui
